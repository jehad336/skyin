# Static preview of the site on GitHub Pages.
# Pages only serves files: accounts, booking, payment and the admin dashboard need the
# Node + PostgreSQL server (forms fall back to WhatsApp, app pages show a "preview" notice).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy static preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Prepare site for a project page (/<repo>/)
        run: |
          # 404.html uses <base href="/">; on Pages the site lives under /<repo>/
          sed -i "s|<base href=\"/\" />|<base href=\"/${GITHUB_REPOSITORY#*/}/\" />|" public/404.html
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
