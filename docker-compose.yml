# Local PostgreSQL for development and tests:  npm run db:up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skyin
      POSTGRES_PASSWORD: skyin
      POSTGRES_DB: skyin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyin"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
