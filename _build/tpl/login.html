  <main id="main">
{{apphead|حسابك في سكاي إن|تسجيل الدخول|تابع حجوزاتك وادفع أونلاين بأمان.}}
    <section class="pb-24">
      <div class="container-x">
        <div class="panel mx-auto max-w-md p-6 md:p-10">
          <form id="login-form" class="grid gap-5" data-app-form novalidate>
            <div data-field>
              <label for="l-email" class="label">البريد الإلكتروني</label>
              <input id="l-email" name="email" type="email" autocomplete="email" class="field text-right" dir="ltr" placeholder="you@example.com" required />
              <p class="err" data-error aria-live="polite"></p>
            </div>
            <div data-field>
              <label for="l-password" class="label">كلمة المرور</label>
              <input id="l-password" name="password" type="password" autocomplete="current-password" class="field" dir="ltr" required />
              <p class="err" data-error aria-live="polite"></p>
            </div>
            <p class="err" data-form-error hidden aria-live="polite"></p>
            <button type="submit" class="btn-primary w-full"><span class="spinner" data-spinner hidden></span><span data-label>دخول</span></button>
          </form>
          <p class="mt-6 text-center text-[14px] text-white/70">ما عندك حساب؟ <a href="register.html" class="text-skyin-cyan hover:underline" data-keep-next>أنشئ حساباً جديداً</a></p>
        </div>
      </div>
    </section>
  </main>
