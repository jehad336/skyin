  <main id="main" data-admin class="min-h-screen pb-24 pt-28 md:pt-32">
    <div class="container-x">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p class="eyebrow">الإدارة</p>
          <h1 class="mt-2 text-[30px] font-medium md:text-[36px]">لوحة التحكم</h1>
        </div>
        <p class="text-[14px] text-fg/60" data-admin-who></p>
      </div>

      <p class="mt-10 text-fg/60" data-admin-loading>جارٍ التحميل…</p>
      <p class="err mt-10" data-admin-denied hidden>هذه الصفحة للإدارة فقط. <a href="login.html?next=admin.html" class="underline">سجّل دخولك بحساب مدير</a>.</p>

      <div data-admin-app hidden>
        <nav class="mt-8 flex gap-2 overflow-x-auto pb-2" aria-label="أقسام لوحة التحكم" data-tabs>
          <button type="button" class="pill-filter is-active" data-tab="overview" aria-pressed="true">نظرة عامة</button>
          <button type="button" class="pill-filter" data-tab="bookings" aria-pressed="false">الحجوزات</button>
          <button type="button" class="pill-filter" data-tab="quotes" aria-pressed="false">طلبات الأسعار <span data-badge="new_quotes"></span></button>
          <button type="button" class="pill-filter" data-tab="messages" aria-pressed="false">الرسائل <span data-badge="new_messages"></span></button>
          <button type="button" class="pill-filter" data-tab="customers" aria-pressed="false">العملاء</button>
          <button type="button" class="pill-filter" data-tab="payments" aria-pressed="false">المدفوعات</button>
          <button type="button" class="pill-filter" data-tab="destinations" aria-pressed="false">الوجهات</button>
        </nav>

        <div class="mt-8" data-panel aria-live="polite"></div>
      </div>
    </div>

    <!-- Admin dialog (booking details, forms) -->
    <div id="admin-modal" class="modal fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-6" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title" hidden>
      <div class="modal-backdrop absolute inset-0 bg-black/70 backdrop-blur-sm" data-close></div>
      <div class="modal-panel relative max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-t-3xl border border-fg/10 bg-surface p-6 sm:rounded-3xl md:p-8">
        <button type="button" class="modal-close absolute end-4 top-4 flex h-10 w-10 items-center justify-center rounded-full bg-fg/5 text-fg hover:bg-fg/10" aria-label="إغلاق" data-close>{{icon:x|h-5 w-5}}</button>
        <h2 id="admin-modal-title" class="pe-12 text-[22px] font-medium" data-modal-title></h2>
        <div class="mt-6" data-modal-body></div>
      </div>
    </div>
  </main>
