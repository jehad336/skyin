  <main id="main" data-pay>
{{apphead|الدفع الآمن|ادفع حجزك}}
    <section class="pb-24">
      <div class="container-x">
        <div class="panel mx-auto max-w-xl p-6 md:p-10" aria-live="polite">
          <p class="text-fg/60" data-pay-loading>جارٍ التحميل…</p>
          <p class="err" data-pay-missing hidden>رابط الدفع غير صحيح أو منتهي. تواصل معنا للمساعدة.</p>

          <div data-pay-box hidden>
            <div class="rounded-2xl border px-4 py-3 text-[14px]" data-pay-alert hidden></div>
            <p class="mt-6 text-[13px] text-fg/60">رقم الحجز <span dir="ltr" class="font-medium text-fg" data-pay-ref></span></p>
            <h2 class="mt-2 text-[24px] font-medium" data-pay-title></h2>
            <dl class="mt-6 grid grid-cols-2 gap-4 text-[14px]">
              <div><dt class="text-fg/50">الاسم</dt><dd class="mt-1" data-pay-name></dd></div>
              <div><dt class="text-fg/50">تاريخ السفر</dt><dd class="mt-1" data-pay-date></dd></div>
              <div><dt class="text-fg/50">المسافرون</dt><dd class="mt-1" data-pay-travelers></dd></div>
              <div><dt class="text-fg/50">الحالة</dt><dd class="mt-1" data-pay-status></dd></div>
            </dl>
            <div class="mt-8 flex flex-col gap-4 border-t border-fg/10 pt-6 sm:flex-row sm:items-center sm:justify-between">
              <p class="text-[28px] font-medium" dir="ltr" data-pay-total></p>
              <button type="button" class="btn-primary" data-pay-btn hidden><span class="spinner" data-spinner hidden></span><span data-label>ادفع الآن</span></button>
            </div>
            <p class="mt-4 text-[13px] text-fg/50" data-pay-methods hidden>مدى · فيزا · ماستركارد · Apple Pay — الدفع يتم عبر بوابة ميسّر المرخّصة، ولا نحتفظ ببيانات بطاقتك.</p>
            <p class="err mt-4" data-pay-error hidden></p>
            <a href="account.html" class="btn-secondary mt-8" data-pay-account hidden>عرض حجوزاتي</a>
          </div>
        </div>
      </div>
    </section>
  </main>
