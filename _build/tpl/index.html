
  <main id="main">
    <section class="hero on-media relative isolate w-full overflow-hidden bg-black">
      <!-- Background video -->
      {{bgvideo|0}}
      <!-- Dark gradient overlay: 10% black at top → 40% black at bottom -->
      <div class="pointer-events-none absolute inset-0 -z-10 bg-gradient-to-b from-black/10 to-black/40" aria-hidden="true"></div>

      <!-- Hero content -->
      <div class="absolute inset-0 z-10 flex items-center justify-center px-6">
        <div class="mx-auto w-full max-w-3xl text-center">
          <h1 class="fade-in-up text-[38px] font-medium leading-[1.3] text-fg md:text-[56px]" style="--d: 450ms">
            سافر حول العالم<br>بدون أي توتر
          </h1>
          <p class="fade-in-up mx-auto mt-5 max-w-xl text-[15px] leading-relaxed text-fg/80 [text-wrap:balance] md:mt-6 md:text-[18px]" style="--d: 600ms">
            اترك التخطيط علينا، واستمتع برحلات مميزة مصممة خصيصاً لك.
          </p>
          <!-- Wrapper carries the entrance animation so the button's hover scale isn't overridden -->
          <div class="fade-in-up mt-8 md:mt-10" style="--d: 750ms">
            <a href="places.html" class="btn-primary">ابدأ الاستكشاف</a>
          </div>
        </div>
      </div>
    </section>
  </main>
